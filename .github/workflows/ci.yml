name: DRISHTI Backend CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenblas-dev libomp-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Generate Mock Data
      working-directory: ./backend
      run: |
        python scripts/generate_data.py

    - name: Build FAISS Index
      working-directory: ./backend
      run: |
        python scripts/build_embeddings.py

    - name: Verify Backend Imports & Router Registration
      working-directory: ./backend
      run: |
        python -c "import main; print('FastAPI app loaded successfully!')"
